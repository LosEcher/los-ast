openapi: 3.0.3
info:
  title: Value Semantics Example
  version: 1.0.0
components:
  schemas:
    SharedFields:
      type: object
      properties:
        email:
          type: string
          minLength: 3
        state:
          type: string
          nullable: true
          pattern: "^(queued|done)$"
          enum:
            - queued
            - done
          default: queued
paths:
  /users:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  nullable: true
                  minLength: 3
                  enum:
                    - active
                    - disabled
                    - archived
                  default: active
                email:
                  $ref: '#/components/schemas/SharedFields/properties/email'
                quota:
                  type: number
                  minimum: 1
                  multipleOf: 1
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: number
                    maximum: 100
                    exclusiveMaximum: true
                    multipleOf: 5
                  state:
                    $ref: '#/components/schemas/SharedFields/properties/state'
