openapi: 3.0.3
info:
  title: Value Semantics Example
  version: 1.0.0
paths:
  /users:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  nullable: true
                  minLength: 3
                  enum:
                    - active
                    - disabled
                    - archived
                  default: active
                email:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                    nullable: true
                    pattern: "^(queued|done)$"
                    enum:
                      - queued
                      - done
                    default: queued
