openapi: 3.0.3
info:
  title: Discriminator Example
  version: 1.1.0
paths:
  /users:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - oneOf:
                    - type: object
                      properties:
                        kind: { type: string }
                        type: { type: string }
                        id: { type: string }
                    - type: object
                      properties:
                        kind: { type: string }
                        type: { type: string }
                        id: { type: string }
                  discriminator:
                    propertyName: type
                    mapping:
                      admin: '#/components/schemas/AdminUser'
                - type: object
                  properties:
                    traceId: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - oneOf:
                      - type: object
                        properties:
                          status: { type: string }
                          id: { type: string }
                      - type: object
                        properties:
                          status: { type: string }
                          id: { type: string }
                    discriminator:
                      propertyName: status
                      mapping:
                        active: '#/components/schemas/ActiveUser'
                  - type: object
                    properties:
                      traceId: { type: string }
