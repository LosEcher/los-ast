openapi: 3.0.3
info:
  title: Value Semantics Example
  version: 1.1.0
components:
  schemas:
    SharedFields:
      type: object
      properties:
        email:
          type: string
          minLength: 8
          format: email
        state:
          type: string
          enum:
            - queued
paths:
  /users:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  minLength: 8
                  enum:
                    - active
                    - disabled
                  default: disabled
                email:
                  $ref: '#/components/schemas/SharedFields/properties/email'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    $ref: '#/components/schemas/SharedFields/properties/state'
