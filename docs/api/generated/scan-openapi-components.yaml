  # @generated scan-contract:ScanPath:begin
  /scan:
    post:
      summary: 执行代码扫描
      description: |-
        同步扫描代码库，返回发现的 issues。
  
        ## 限制
        - 最大文件数：1000（可配置）
        - 最大响应大小：10MB（可配置）
        - 最大执行时间：30s（可配置）
  
        ## 取消语义
        - Client Disconnect: HTTP 连接断开时扫描终止
        - Server Timeout: 超过 `maxDurationMs` 返回 408
  
        ## Scope 要求
        - 生产环境：必须提供完整的 `tenant_id`, `project_id`, `actor_id`
        - 生产环境：`mode: 'local'` 会被拒绝（403）
        - 开发环境：允许 `mode: 'local'` 简化调试
      tags:
        - Scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
            examples:
              minimal:
                summary: 最小请求
                value:
                  scope:
                    tenant_id: tenant-001
                    project_id: project-001
                    actor_id: actor-001
                  project: my-project
                  rootDir: /path/to/code
              withOptions:
                summary: 完整选项
                value:
                  scope:
                    tenant_id: org_123
                    project_id: myapp
                    actor_id: user_456
                    mode: service
                  project: myapp
                  rootDir: /workspace/myapp
                  include:
                    - src/**/*.ts
                  ignore:
                    - "**/*.spec.ts"
                    - node_modules/**
                  includeStats: true
                  deterministic: true
              withSchemaArtifacts:
                summary: 合并数据库 Schema Findings
                value:
                  scope:
                    tenant_id: tenant-001
                    project_id: project-001
                    actor_id: actor-001
                    mode: service
                  project: my-project
                  rootDir: /path/to/code
                  schemaArtifacts:
                    - source: schema/user-db.sql
                      ruleId: schema/user-email-nullability
                      severity: warning
                      message: 字段 email 未限制为非空
                      file: schema/users.sql
                      line: 17
                      column: 4
                      governanceDomain: database
                      impactHint: medium
      responses:
        "200":
          description: 扫描成功
          headers:
            X-Request-ID:
              description: 请求追踪 ID
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResponse"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validation:
                  summary: 参数验证失败
                  value:
                    error:
                      category: VALIDATION
                      code: INVALID_PROJECT
                      message: project must be a non-empty string
                      requestId: req-123
                      timestamp: 2026-03-07T12:00:00.000Z
                      retryable: false
        "401":
          description: 身份验证失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingJwt:
                  summary: 缺少 JWT
                  value:
                    error:
                      category: AUTHENTICATION
                      code: MISSING_JWT
                      message: JWT token is required in production environment
                      requestId: req-123
                      timestamp: 2026-03-07T12:00:00.000Z
                      retryable: false
        "403":
          description: 生产环境拒绝 local 模式
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                localForbidden:
                  summary: Local 模式被禁止
                  value:
                    error:
                      category: SCOPE
                      code: LOCAL_SCOPE_FORBIDDEN
                      message: scope.mode=local is not allowed in production
                      requestId: req-123
                      timestamp: 2026-03-07T12:00:00.000Z
                      retryable: false
        "408":
          description: 扫描超时
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                timeout:
                  summary: 扫描超时
                  value:
                    error:
                      category: TIMEOUT
                      code: REQUEST_TIMEOUT
                      message: Operation exceeded 30000ms limit
                      requestId: req-123
                      timestamp: 2026-03-07T12:00:00.000Z
                      retryable: true
        "413":
          description: 扫描结果过大
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                tooLarge:
                  summary: 响应过大
                  value:
                    error:
                      category: SCAN_TOO_LARGE
                      code: SCAN_TOO_LARGE
                      message: Estimated 1524 files exceeds limit 1000. Use smaller include patterns or async task mode.
                      requestId: req-123
                      timestamp: 2026-03-07T12:00:00.000Z
                      retryable: false
                      details:
                        limit: 1000
                        estimated: 1524
        "503":
          description: Core 未就绪（显式降级）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                coreNotReady:
                  summary: Core not ready
                  value:
                    error:
                      category: SERVICE_UNAVAILABLE
                      code: CORE_NOT_READY
                      message: Core is not ready
                      requestId: req-123
                      timestamp: 2026-03-07T12:00:00.000Z
                      retryable: true
                      details:
                        reason: core_not_ready
  # @generated scan-contract:ScanPath:end

